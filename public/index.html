<!doctype html>
<html lang='en'>
  <head>
    <title>CS4241 Assignment 2</title>
    <meta charset='utf-8' />
    <script src='js/main.js'></script>
    <link rel='stylesheet' href='css/main.css' />
    
    <!-- get rid of favicon error -->
    <link rel='icon' href='data:;base64,iVBORw0KGgo=' />
  </head>
  <body>
    <header>
      <button id="back" class="game-element" hidden>Back</button>
    </header>
    <section class="menu-element">
      <form>
        <p>Enter Your Name</p>
        <input type='text' id="username">
      </form>
      <button id="start">Start</button>
    </section>
    <section class="game-element" hidden>
      <h1>Solve The Problem</h1>
      <form>
        <p id="problem">???</p>
        <input type='text' id='answer' value=''>
        <button id ='submit'>submit</button>
      </form>
    </section>
    <section class="game-element" hidden>
      <h1>Leaderboard</h1>
      <table>
        <thead>
          <th scope="col">Rank?</th>
          <th scope="col">Username</th>
          <th scope="col">Correct Guesses</th>
          <th scope="col">Total Guesses</th>
          <th scope="col">Accuracy</th>
        </thead>
        <tbody id="leaderboard-players">
        </tbody>
      </table>
    </section>
  </body>
</html>
